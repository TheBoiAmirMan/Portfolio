<!doctype html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="مهندسی داده، تحلیل داده. پروژه‌ها، نوشته‌ها و کتاب‌ها.">
  <meta name="theme-color" content="#111211">
  <title>مهندسی و تحلیل داده | امیرعلی کوهپایه</title>
  <script>
    try { const theme = localStorage.getItem('portfolio-theme'); if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme; } catch {}
  </script>
  <link rel="stylesheet" href="styles.css?v=20261006-2">
  <script src="app.js?v=20261006-2" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">محتوای اصلی</a>
  <header class="header shell">
    <nav aria-label="ناوبری اصلی"><a href="#projects">پروژه‌ها</a><a href="#writing">نوشته‌ها</a><a href="#books">کتاب‌ها</a></nav>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="فعال کردن حالت روشن" title="حالت روشن">
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"></path></svg>
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M20.2 15.6A8.6 8.6 0 0 1 8.4 3.8 8.6 8.6 0 1 0 20.2 15.6Z"></path></svg>
    </button>
  </header>
  <main id="main" class="shell">
    <section id="home" class="hero" aria-labelledby="role-title">
      <p class="name">امیرعلی کوهپایه</p>
      <h1 id="role-title" class="role-title" aria-label="مهندس داده و تحلیلگر داده">
        <span class="role-swap" aria-hidden="true"><span class="role-word is-active">مهندس</span><span class="role-word">تحلیلگر</span></span>
        <strong class="data-word" aria-hidden="true">داده<span class="period">.</span></strong>
      </h1>
      <div class="hero-bottom"><p class="tools" lang="en" dir="ltr">SQL <span>/</span> Python <span>/</span> Power BI</p><a class="explore" href="#projects" aria-label="دیدن پروژه‌ها">پروژه‌ها <span aria-hidden="true">↓</span></a></div>
    </section>
    <section id="projects" class="collection" aria-labelledby="projects-title">
      <div class="section-heading"><h2 id="projects-title">پروژه‌ها</h2><span class="section-number" aria-hidden="true">01</span></div>
      <div id="projects-list" class="item-list"><p class="empty-state">هنوز پروژه‌ای اضافه نشده.</p></div>
    </section>
    <section id="writing" class="collection" aria-labelledby="writing-title">
      <div class="section-heading"><h2 id="writing-title">نوشته‌ها</h2><span class="section-number" aria-hidden="true">02</span></div>
      <div id="writing-list" class="item-list"><p class="empty-state">هنوز نوشته‌ای اضافه نشده.</p></div>
    </section>
    <section id="books" class="collection" aria-labelledby="books-title">
      <div class="section-heading"><h2 id="books-title">کتاب‌ها</h2><span class="section-number" aria-hidden="true">03</span></div>
      <div id="books-list" class="item-list"><p class="empty-state">هنوز کتابی اضافه نشده.</p></div>
    </section>
  </main>
  <footer class="footer shell"><a href="https://github.com/TheBoiAmirMan" target="_blank" rel="noopener noreferrer" lang="en" dir="ltr">GitHub <span aria-hidden="true">↗</span></a><a href="#home" aria-label="برگشت به بالا">↑</a></footer>
  <noscript><p class="noscript-note">نمایش محتوا و تغییر تم به جاوااسکریپت نیاز دارد.</p></noscript>
</body>
</html>
